<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Endorsements Mapped by Area</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        #map { width: 100%; height: 85vh; margin: 0; }
        body { font-family: sans-serif; margin: 0; padding: 20px; text-align: center; background: #f9f9f9; }
        h1 { margin-bottom: 5px; font-size: 1.5rem; }
        p { color: #555; margin-top: 0; }
    </style>

    <!-- Load your external districts JavaScript file -->
    <script src="districts.js"></script>
</head>
<body>

    <h1>Find Your Area & Info</h1>
    <p>Click on the shaded area to view your local area details and open the document.</p>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered around your area
        var map = L.map('map').setView([34.05, -84.8], 11);

        // Add OpenStreetMap background tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Render the district polygons from districts.js onto the map with popup links
        L.geoJSON(districtData, {
            style: {
                color: "#e63946",
                weight: 3,
                fillColor: "#457b9d",
                fillOpacity: 0.5
            },
            onEachFeature: function (feature, layer) {
                let pdfUrl = feature.properties.pdf_url || '#';
                let districtName = feature.properties.name || 'District';

                layer.bindPopup(
                    `<strong>${districtName}</strong><br><br>` +
                    `<a href="${pdfUrl}" target="_blank" style="color: #1d3557; font-weight: bold;">Open District PDF Document</a>`
                );
            }
        }).addTo(map);
    </script>

</body>
</html>
